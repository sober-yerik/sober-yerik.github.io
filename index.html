<script>
/* ===== VISTA/JS/tema.js — aplica el tema antes de pintar ===== */
(function () {
  var guardado = null;
  try { guardado = localStorage.getItem('tema'); } catch (e) {}
  var oscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.tema = guardado || (oscuro ? 'oscuro' : 'claro');
})();
</script>
<style>
/* ===== VISTA/CSS/estilos.css ===== */
:root,[data-tema="claro"]{
  color-scheme:light;
  --fondo:#FFFFFF;
  --superficie:#F5F5FA;
  --texto:#15151F;
  --suave:#6B6B7B;
  --linea:#E6E6EE;
  --acento:#3D4CFF;
  --acento-osc:#2733D6;
  --sobre-acento:#FFFFFF;
  --coral:#E8503F;
  --ok:#0F7B4B;
  --error:#C62828;
}
[data-tema="oscuro"]{
  color-scheme:dark;
  --fondo:#12121C;
  --superficie:#1C1C2B;
  --texto:#F2F2F8;
  --suave:#A3A3B8;
  --linea:#2E2E44;
  --acento:#7B87FF;
  --acento-osc:#98A1FF;
  --sobre-acento:#10101A;
  --coral:#FF8272;
  --ok:#4CD694;
  --error:#FF8A80;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--fondo);color:var(--texto);line-height:1.55;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;transition:background .25s ease,color .25s ease}
main{flex:1}
a{color:var(--acento)}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block;max-width:100%}
h1{line-height:1.15;letter-spacing:-.02em}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
.envuelve{max-width:1200px;margin:0 auto;padding:0 24px}

.cab{position:sticky;top:0;z-index:50;background:var(--fondo);border-bottom:1px solid var(--linea)}
.cab-fila{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.icono{background:none;border:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.8rem;line-height:1}
.icono:hover{background:var(--superficie)}
.marca{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--texto);font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.sol{display:none}
[data-tema="oscuro"] .sol{display:block}
[data-tema="oscuro"] .luna{display:none}

.velo{position:fixed;inset:0;background:rgba(10,10,20,.55);opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:80}
.velo.abierto{opacity:1;pointer-events:auto}
.menu{position:fixed;top:0;left:0;height:100%;width:min(320px,86%);background:var(--fondo);border-right:1px solid var(--linea);z-index:90;padding:16px;transform:translateX(-100%);transition:transform .3s ease;display:flex;flex-direction:column;gap:8px}
.menu.abierto{transform:none}
.menu-cab{display:flex;justify-content:space-between;align-items:center;font-size:1.2rem;padding:4px 4px 12px}
.saludo{padding:0 12px 8px;color:var(--suave)}
.menu nav{display:grid;gap:4px}
.menu nav a,.menu nav button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:14px 12px;font-weight:600;font-size:1.05rem;text-decoration:none;color:var(--texto)}
.menu nav a:hover,.menu nav button:hover{background:var(--superficie)}

.aviso{max-width:1200px;margin:16px auto 0;padding:12px 18px;border-radius:12px;font-weight:600;font-size:.95rem;background:var(--superficie);border:1px solid var(--linea);width:calc(100% - 48px)}
.aviso-ok{color:var(--ok);border-color:var(--ok)}
.aviso-error{color:var(--error);border-color:var(--error)}
.tarjeta .aviso{width:100%;margin:0}

.oferta{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;padding-top:32px;padding-bottom:64px;align-items:center}
.carrusel{position:relative;border-radius:24px;overflow:hidden;background:var(--superficie);aspect-ratio:4/3}
.pista{display:flex;height:100%;transition:transform .5s cubic-bezier(.22,.9,.35,1)}
.diapo{flex:0 0 100%;height:100%}
.diapo img{width:100%;height:100%;object-fit:cover}
.car-btn{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:var(--fondo);color:var(--texto);font-size:1.6rem;line-height:1;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.car-btn:hover{background:var(--superficie)}
.prev{left:14px}
.next{right:14px}
.puntos{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.puntos button{width:10px;height:10px;border-radius:50%;border:0;background:rgba(255,255,255,.6);box-shadow:0 0 0 1px rgba(0,0,0,.25);padding:0}
.puntos button[aria-current="true"]{background:var(--acento);width:26px;border-radius:999px}

.insignia{display:inline-block;background:var(--coral);color:#fff;font-weight:700;font-size:.85rem;padding:5px 14px;border-radius:999px;margin-bottom:14px}
[data-tema="oscuro"] .insignia{color:#12121C}
.panel h1{font-size:clamp(1.9rem,3.2vw,2.7rem);font-weight:800;margin-bottom:12px}
.precios{display:flex;align-items:baseline;gap:14px;margin-bottom:14px}
.precios b{font-size:1.9rem;font-weight:800}
.precios s{color:var(--suave);font-size:1.1rem}
.descripcion{color:var(--suave);margin-bottom:24px;max-width:46ch}
.tiempo{display:flex;gap:10px;margin-bottom:26px}
.u{background:var(--superficie);border:1px solid var(--linea);border-radius:14px;padding:10px 6px;min-width:70px;text-align:center;font-size:.78rem;color:var(--suave);display:grid}
.u b{font-size:1.6rem;font-weight:800;color:var(--texto);font-variant-numeric:tabular-nums}
.terminada{font-weight:800;font-size:1.2rem;color:var(--coral)}

.btn{display:inline-block;background:var(--acento);color:var(--sobre-acento);border:0;border-radius:999px;padding:15px 28px;font-weight:700;font-size:1rem;text-decoration:none;text-align:center;transition:background .2s ease,transform .15s ease}
.btn:hover{background:var(--acento-osc);transform:translateY(-1px)}

.auth{display:grid;place-items:center;padding:48px 24px}
.tarjeta{width:100%;max-width:440px;background:var(--superficie);border:1px solid var(--linea);border-radius:24px;padding:32px;display:grid;gap:16px}
.tarjeta h1{font-size:1.7rem}
.tarjeta label{display:grid;gap:6px;font-weight:600;font-size:.92rem}
.tarjeta input{font:inherit;font-weight:400;padding:13px 16px;border-radius:12px;border:1.5px solid var(--linea);background:var(--fondo);color:var(--texto)}
.tarjeta input:focus{border-color:var(--acento)}
.tarjeta .btn{width:100%}
.cambio{text-align:center;font-size:.92rem;color:var(--suave)}
.captcha{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.captcha img{border-radius:10px;border:1px solid var(--linea)}
.enlace{background:none;border:0;color:var(--acento);text-decoration:underline;font-size:.9rem}

.pie{border-top:1px solid var(--linea);background:var(--superficie);padding:28px 0}
.pie-fila{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;color:var(--suave);font-size:.92rem}
.redes{display:flex;gap:12px;flex-wrap:wrap}
.red{display:flex;align-items:center;gap:10px;background:var(--fondo);border:1px solid var(--linea);border-radius:999px;padding:8px 18px 8px 10px;text-decoration:none;color:var(--texto);font-weight:600;transition:transform .15s ease,border-color .15s ease}
.red:hover{transform:translateY(-2px);border-color:var(--acento)}
.red img{border-radius:50%}

@media (max-width:900px){
  .oferta{grid-template-columns:1fr;gap:28px}
}
@media (max-width:480px){
  .marca-nombre{display:none}
  .tarjeta{padding:24px}
  .u{min-width:62px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
}

.logo-caja{height:52px;border-radius:8px;overflow:hidden;display:flex;align-items:center}
.logo-caja img{height:100%;width:auto;object-fit:contain}
.vacio{display:grid;gap:16px;justify-items:start;padding-top:64px;padding-bottom:64px}
.vacio p{color:var(--suave)}

/* =====================================
   MENÚ SECUNDARIO SOBER
   ===================================== */

.menu-secundario {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 30px;
  padding: 14px 20px;
  background: var(--superficie);
  border-bottom: 1px solid var(--linea);
}

.menu-secundario a {
  color: var(--texto);
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  transition: color 0.2s ease;
}

.menu-secundario a:hover {
  color: var(--acento);
}

@media (max-width: 600px) {
  .menu-secundario {
    gap: 16px;
    padding: 12px 8px;
  }

  .menu-secundario a {
    font-size: 12px;
  }
}
</style>
</head>

const h = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ahora = () => Math.floor(Date.now() / 1000);

/* ======================================================================
   MODELO/Conexion.php — "base de datos" sobre localStorage
   (tablas: usuarios, ajustes). Sustituye a SQLite en GitHub Pages.
   ====================================================================== */
const Conexion = {
  PREFIJO: 'sober_db_',
  _mem: {},
  leer(tabla, defecto) {
    try {
      const v = localStorage.getItem(this.PREFIJO + tabla);
      if (v !== null) return JSON.parse(v);
    } catch (e) {}
    return this._mem[tabla] ?? defecto;
  },
  escribir(tabla, datos) {
    this._mem[tabla] = datos;
    try { localStorage.setItem(this.PREFIJO + tabla, JSON.stringify(datos)); } catch (e) {}
  },
  usuarios() { return this.leer('usuarios', []); },
  guardarUsuarios(l) { this.escribir('usuarios', l); },
  ajustes() { return this.leer('ajustes', {}); },
  guardarAjustes(a) { this.escribir('ajustes', a); },
  correos() { return this.leer('correos', []); },
  guardarCorreos(c) { this.escribir('correos', c); }
};

/* ======================================================================
   MODELO/Usuario.php
   ====================================================================== */
const Usuario = {
  porCorreo(correo) {
    return Conexion.usuarios().find(u => u.correo === correo) || null;
  },
  crear(nombre, correo, clave, tokenHash) {
    const l = Conexion.usuarios();
    const id = l.reduce((m, u) => Math.max(m, u.id), 0) + 1;
    l.push({ id, nombre, correo, clave, verificado: 0, token: tokenHash, creado: ahora() });
    Conexion.guardarUsuarios(l);
  },
  verificar(tokenHash) {
    const l = Conexion.usuarios();
    const u = l.find(x => x.token === tokenHash && !x.verificado);
    if (!u) return false;
    u.verificado = 1;
    u.token = null;
    Conexion.guardarUsuarios(l);
    return true;
  }
};

   MODELO/Oferta.php
   ====================================================================== */
const Oferta = {
  fin() {
    const a = Conexion.ajustes();
    if (a.oferta_fin) return +a.oferta_fin;
    a.oferta_fin = ahora() + Config.OFERTA_DIAS * 86400;
    Conexion.guardarAjustes(a);
    return a.oferta_fin;
  }
};

/* ======================================================================
   CONTROLADOR/Sesion.php — sesión en sessionStorage (dura mientras la pestaña)
   ====================================================================== */
const Sesion = {
  _mem: {},
  _get() {
    try { return JSON.parse(sessionStorage.getItem('sober_sesion') || '{}'); } catch (e) { return this._mem; }
  },
  _set(o) {
    this._mem = o;
    try { sessionStorage.setItem('sober_sesion', JSON.stringify(o)); } catch (e) {}
  },
  usuario() { return this._get().usuario || null; },
  poner(k, v) { const s = this._get(); s[k] = v; this._set(s); },
  tomar(k) { const s = this._get(); const v = s[k] ?? null; delete s[k]; this._set(s); return v; },
  avisar(tipo, texto) { this.poner('aviso', { tipo, texto }); },
  aviso() { return this.tomar('aviso'); },
  destruir() { this._set({}); },
  ir(destino) { location.hash = destino; }
};

/* ======================================================================
   CONTROLADOR/CaptchaControlador.php
   ====================================================================== */
const CaptchaControlador = {
  generar() {
    const letras = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const r = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    let codigo = '';
    for (let i = 0; i < 5; i++) codigo += letras[r(0, letras.length - 1)];
    Sesion.poner('captcha', codigo);
    let svg = '<svg xmlns="http://www.w3.org/2000/svg" width="170" height="56" viewBox="0 0 170 56"><rect width="170" height="56" fill="#eef0ff"/>';
    for (let i = 0; i < 6; i++) svg += `<line x1="${r(0,170)}" y1="${r(0,56)}" x2="${r(0,170)}" y2="${r(0,56)}" stroke="#8a90d6" stroke-width="1.5"/>`;
    for (let i = 0; i < 5; i++) {
      const x = 16 + i * 30;
      svg += `<text x="${x}" y="${r(34,42)}" font-family="Verdana,sans-serif" font-size="30" font-weight="700" fill="#1b1b3a" transform="rotate(${r(-22,22)} ${x} 30)">${codigo[i]}</text>`;
    }
    svg += '</svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  },
  validar(texto) {
    const esperado = Sesion.tomar('captcha');
    return esperado !== null && typeof texto === 'string' && esperado === texto.trim().toUpperCase();
  }
};

/* ======================================================================
   CONTROLADOR/AuthControlador.php
   ====================================================================== */
const Cripto = {
  hex(buf) { return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join(''); },
  aleatorio(n) { const b = new Uint8Array(n); crypto.getRandomValues(b); return this.hex(b); },
  async sha256(t) {
    return this.hex(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)));
  },
  async hashClave(clave) {
    const sal = this.aleatorio(16);
    return sal + ':' + await this._pbkdf2(clave, sal);
  },
  async verificarClave(clave, guardada) {
    const [sal, hash] = guardada.split(':');
    return await this._pbkdf2(clave, sal) === hash;
  },
  async _pbkdf2(clave, sal) {
    const enc = new TextEncoder();
    const k = await crypto.subtle.importKey('raw', enc.encode(clave), 'PBKDF2', false, ['deriveBits']);
    return this.hex(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(sal), iterations: 100000, hash: 'SHA-256' }, k, 256));
  }
};

const AuthControlador = {
  async registrar(d) {
    if (!CaptchaControlador.validar(d.captcha)) return 'El código de seguridad no coincide.';
    const nombre = (d.nombre || '').trim();
    const correo = (d.correo || '').trim().toLowerCase();
    const clave = d.clave || '';
    if (nombre.length < 2 || nombre.length > 60) return 'Escribe tu nombre (de 2 a 60 caracteres).';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) return 'Escribe un correo válido.';
    if (clave.length < 8) return 'La contraseña debe tener al menos 8 caracteres.';
    if (clave !== (d.clave2 || '')) return 'Las contraseñas no coinciden.';
    if (Usuario.porCorreo(correo)) return 'Ese correo ya tiene una cuenta.';
    const token = Cripto.aleatorio(32);
    Usuario.crear(nombre, correo, await Cripto.hashClave(clave), await Cripto.sha256(token));
    this.enviarVerificacion(correo, nombre, token);
    return null;
  },
  async iniciar(d) {
    const usuario = Usuario.porCorreo((d.correo || '').trim().toLowerCase());
    if (!usuario || !(await Cripto.verificarClave(d.clave || '', usuario.clave))) {
      await new Promise(r => setTimeout(r, 400));
      return 'Correo o contraseña incorrectos.';
    }
    if (!usuario.verificado) return 'Primero verifica tu correo con el enlace que te enviamos.';
    Sesion.poner('usuario', { id: usuario.id, nombre: usuario.nombre });
    return null;
  },
  async verificar(token) {
    return /^[a-f0-9]{64}$/.test(token || '') && Usuario.verificar(await Cripto.sha256(token));
  },
  cerrar() { Sesion.destruir(); },
  enviarVerificacion(correo, nombre, token) {
    const base = location.href.split('#')[0];
    const enlace = base + '#/verificar?token=' + token;
    const mensaje = `Hola ${nombre},\n\nPara activar tu cuenta en ${Config.NOMBRE_SITIO} abre este enlace:\n${enlace}\n\nSi no creaste la cuenta, ignora este mensaje.`;
    // Sin servidor no se pueden enviar correos: se guarda en el "log" (equivale a MODO_LOCAL)
    const log = Conexion.correos();
    log.push({ fecha: new Date().toISOString(), para: correo, mensaje });
    Conexion.guardarCorreos(log);
    Sesion.poner('enlace_local', enlace);
  }
};

/* ======================================================================
   CONTROLADOR/OfertaControlador.php
   ====================================================================== */
const OfertaControlador = {
  estado() { return { fin: Oferta.fin(), ahora: ahora() }; }
};

/* ======================================================================
   VISTA — parciales y páginas (antes PUBLICO/*.php + VISTA/parciales)
   ====================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const img = n => IMG[n] || '';

const Vista = {
  menu() {
    const u = Sesion.usuario();
    $('#menuContenido').innerHTML = `
      ${u ? `<p class="saludo">Hola, ${h(u.nombre)}</p>` : ''}
      <nav>
        <a href="#/">Home</a>
        ${u ? '<button type="button" id="btnSalir">Cerrar sesión</button>'
            : '<a href="#/iniciar-sesion">Iniciar sesión</a><a href="#/registro">Registrarse</a>'}
      </nav>`;
    const salir = $('#btnSalir');
    if (salir) salir.addEventListener('click', () => { AuthControlador.cerrar(); cerrarMenu(); Sesion.ir('/'); Router.pintar(); });
  },
  avisos() {
    const aviso = Sesion.aviso();
    const enlace = Sesion.tomar('enlace_local');
    $('#avisos').innerHTML =
      (aviso ? `<div class="aviso aviso-${h(aviso.tipo)}" role="status">${h(aviso.texto)}</div>` : '') +
      (enlace ? `<div class="aviso aviso-ok" role="status">Modo local: <a href="${h(enlace)}">verificar mi correo ahora</a></div>` : '');
  },

  oferta() {
    const o = Config.OFERTA;
    const desc = Math.round((1 - o.precio / o.precio_anterior) * 100);
    const fmt = n => n.toLocaleString('en-US');
    const u = Sesion.usuario();
    return `
<main class="envuelve oferta">
  <div class="carrusel" role="region" aria-roledescription="carrusel" aria-label="Fotos de ${h(o.nombre)}" tabindex="0">
    <div class="pista">
      ${o.fotos.map((f, i) => `<figure class="diapo"><img src="${img(f)}" alt="${h(o.nombre)}, foto ${i + 1}"></figure>`).join('')}
    </div>
    <button class="car-btn prev" type="button" aria-label="Foto anterior">‹</button>
    <button class="car-btn next" type="button" aria-label="Foto siguiente">›</button>
    <div class="puntos"></div>
  </div>
  <div class="panel">
    <span class="insignia">−${desc}% de descuento</span>
    <h1>${h(o.nombre)}</h1>
    <p class="precios"><b>$${fmt(o.precio)} ${h(o.moneda)}</b><s>$${fmt(o.precio_anterior)}</s></p>
    <p class="descripcion">${h(o.descripcion)}</p>
    <div class="tiempo" id="temporizador" role="timer" aria-label="Tiempo restante de la oferta">
      <span class="u"><b data-u="d">00</b>días</span>
      <span class="u"><b data-u="h">00</b>horas</span>
      <span class="u"><b data-u="m">00</b>min</span>
      <span class="u"><b data-u="s">00</b>seg</span>
    </div>
    ${u ? `<a class="btn" href="${h(Config.ENLACE_COMPRA)}">Aprovechar oferta</a>`
        : '<a class="btn" href="#/registro">Crear cuenta para aprovechar la oferta</a>'}
  </div>
</main>`;
  },

  iniciarSesion(error, correo) {
    return `
<main class="auth">
  <form class="tarjeta" id="formLogin" novalidate>
    <h1>Iniciar sesión</h1>

    <label>Correo electrónico
      <input type="email" name="correo" value="${h(correo)}" autocomplete="email" required>
    </label>
    <label>Contraseña
      <input type="password" name="clave" autocomplete="current-password" required>
    </label>
    <button class="btn" type="submit">Entrar</button>
    <p class="cambio">¿No tienes cuenta? <a href="#/registro">Regístrate</a></p>
  </form>
</main>`;
  },

  registro(error, v = {}) {
    return `
<main class="auth">
  <form class="tarjeta" id="formRegistro" novalidate>
    <h1>Crear cuenta</h1>
    ${error ? `<p class="aviso aviso-error" role="alert">${h(error)}</p>` : ''}
    <label>Nombre
      <input type="text" name="nombre" value="${h(v.nombre)}" autocomplete="name" required>
    </label>
    <label>Correo electrónico
      <input type="email" name="correo" value="${h(v.correo)}" autocomplete="email" required>
    </label>
    <label>Contraseña (mínimo 8 caracteres)
      <input type="password" name="clave" autocomplete="new-password" minlength="8" required>
    </label>
    <label>Repite la contraseña
      <input type="password" name="clave2" autocomplete="new-password" required>
    </label>
    <div class="captcha">
      <img id="captchaImg" src="${CaptchaControlador.generar()}" width="170" height="56" alt="Código de seguridad">
      <button class="enlace" type="button" id="recargarCaptcha">Cambiar código</button>
    </div>
    <label>Escribe el código de la imagen
      <input type="text" name="captcha" maxlength="5" autocomplete="off" required>
    </label>
    <button class="btn" type="submit">Crear cuenta</button>
    <p class="cambio">¿Ya tienes cuenta? <a href="#/iniciar-sesion">Inicia sesión</a></p>

  },

  proximamente(titulo) {
    return `<main class="envuelve vacio"><h1>${h(titulo)}</h1><p>Próximamente.</p><a class="btn" href="#/">Volver al inicio</a></main>`;
  }
};

/* ======================================================================
   VISTA/JS/main.js — comportamiento (menú, tema, carrusel, temporizador)
   ====================================================================== */
let limpiezas = [];

function cerrarMenu() {
  $('#menu').classList.remove('abierto');
  $('#velo').classList.remove('abierto');
  $('#menu').inert = true;
  $('#menuBtn').setAttribute('aria-expanded', 'false');
}

function iniciarTema() {
  const boton = $('#temaBtn'), raiz = document.documentElement;
  const etiquetar = () => boton.setAttribute('aria-label', raiz.dataset.tema === 'oscuro' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro');
  boton.addEventListener('click', () => {
    const nuevo = raiz.dataset.tema === 'oscuro' ? 'claro' : 'oscuro';
    raiz.dataset.tema = nuevo;
    try { localStorage.setItem('tema', nuevo); } catch (e) {}
    etiquetar();
  });
  etiquetar();
}

function iniciarMenu() {
  const panel = $('#menu'), velo = $('#velo'), boton = $('#menuBtn');
  panel.inert = true;
  boton.addEventListener('click', () => {
    panel.classList.add('abierto'); velo.classList.add('abierto');
    panel.inert = false; boton.setAttribute('aria-expanded', 'true');
    $('#menuCerrar').focus();
  });
  const cerrar = () => { cerrarMenu(); boton.focus(); };
  $('#menuCerrar').addEventListener('click', cerrar);
  velo.addEventListener('click', cerrar);
  panel.addEventListener('click', e => { if (e.target.closest('a')) cerrarMenu(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && panel.classList.contains('abierto')) cerrar(); });
}

function iniciarCarrusel() {
  const c = $('.carrusel');
  if (!c) return;
  const pista = $('.pista', c), puntos = $('.puntos', c), n = pista.children.length;
  let i = 0, reloj;
  const ir = k => {
    i = (k + n) % n;
    pista.style.transform = `translateX(-${i * 100}%)`;
    $$('button', puntos).forEach((p, j) => p.setAttribute('aria-current', String(j === i)));
  };
  const parar = () => clearInterval(reloj);
  const arrancar = () => {
    parar();
    if (n > 1 && !matchMedia('(prefers-reduced-motion: reduce)').matches) reloj = setInterval(() => ir(i + 1), 5000);
  };
  for (let j = 0; j < n; j++) {
    const p = document.createElement('button');
    p.type = 'button';
    p.setAttribute('aria-label', 'Ir a la foto ' + (j + 1));
    p.addEventListener('click', () => { ir(j); arrancar(); });
    puntos.appendChild(p);
  }
  if (n < 2) $$('.car-btn', c).forEach(b => { b.hidden = true; });
  $('.prev', c).addEventListener('click', () => { ir(i - 1); arrancar(); });
  $('.next', c).addEventListener('click', () => { ir(i + 1); arrancar(); });
  c.addEventListener('mouseenter', parar);
  c.addEventListener('mouseleave', arrancar);
  c.addEventListener('focusin', parar);
  c.addEventListener('focusout', arrancar);
  c.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') ir(i - 1); if (e.key === 'ArrowRight') ir(i + 1); });
  let x0 = null;
  c.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  c.addEventListener('touchend', e => {
    if (x0 === null) return;
    const d = e.changedTouches[0].clientX - x0;
    if (Math.abs(d) > 40) { ir(d < 0 ? i + 1 : i - 1); arrancar(); }
    x0 = null;
  });
  ir(0); arrancar();
  limpiezas.push(parar);
}

function iniciarTemporizador() {
  const el = $('#temporizador');
  if (!el) return;
  const cero = n => String(n).padStart(2, '0');
  const dibujar = () => {
    const { fin, ahora: t } = OfertaControlador.estado();
    const s = Math.max(0, fin - t);
    if (s === 0) { clearInterval(reloj); el.innerHTML = '<p class="terminada">Oferta finalizada</p>'; return; }
    $('[data-u="d"]', el).textContent = cero(Math.floor(s / 86400));
    $('[data-u="h"]', el).textContent = cero(Math.floor(s % 86400 / 3600));
    $('[data-u="m"]', el).textContent = cero(Math.floor(s % 3600 / 60));
    $('[data-u="s"]', el).textContent = cero(s % 60);
  };
  const reloj = setInterval(dibujar, 1000);
  dibujar();
  limpiezas.push(() => clearInterval(reloj));
}

function iniciarFormularios() {
  const login = $('#formLogin');
  if (login) login.addEventListener('submit', async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(login));
    const boton = $('button[type=submit]', login); boton.disabled = true;
    const error = await AuthControlador.iniciar(d);
    if (!error) { Sesion.ir('/'); return; }
    $('#app').innerHTML = Vista.iniciarSesion(error, d.correo);
    iniciarFormularios();
  });
  const reg = $('#formRegistro');
  if (reg) {
    $('#recargarCaptcha').addEventListener('click', () => { $('#captchaImg').src = CaptchaControlador.generar(); });
    reg.addEventListener('submit', async e => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(reg));
      const boton = $('button[type=submit]', reg); boton.disabled = true;
      let error;
      try { error = await AuthControlador.registrar(d); }
      catch (err) { error = 'Tu navegador no permite crear cuentas aquí (se necesita HTTPS). Abre el sitio desde GitHub Pages.'; }
      if (!error) {
        Sesion.avisar('ok', 'Cuenta creada. Te enviamos un enlace para verificar tu correo.');
        Sesion.ir('/iniciar-sesion');
        return;
      }
      $('#app').innerHTML = Vista.registro(error, d);
      iniciarFormularios();
    });
  }
}

/* ======================================================================
   ROUTER — sustituye a los archivos de PUBLICO/ (compatible con GitHub Pages)
   ====================================================================== */
const Router = {
  async pintar() {
    limpiezas.forEach(f => f()); limpiezas = [];
    const crudo = (location.hash || '#/').slice(1);
    const [ruta, consulta = ''] = crudo.split('?');
    const params = new URLSearchParams(consulta);
    const app = $('#app');
    const u = Sesion.usuario();
    let titulo = 'Inicio';

    switch (ruta) {
      case '/iniciar-sesion':
        if (u) return Sesion.ir('/');
        titulo = 'Iniciar sesión'; app.innerHTML = Vista.iniciarSesion(null, ''); break;
      case '/registro':
        if (u) return Sesion.ir('/');
        titulo = 'Registrarse'; app.innerHTML = Vista.registro(null); break;
      case '/verificar': {
        const ok = await AuthControlador.verificar(params.get('token'));
        Sesion.avisar(ok ? 'ok' : 'error', ok ? 'Correo verificado. Ya puedes iniciar sesión.' : 'El enlace no es válido o ya fue usado.');
        return Sesion.ir('/iniciar-sesion');
      }
      case '/novedades': titulo = 'Novedades'; app.innerHTML = Vista.proximamente(titulo); break;
      case '/ofertas': titulo = 'Ofertas'; app.innerHTML = Vista.proximamente(titulo); break;
      case '/mas-vendidos': titulo = 'Más vendidos'; app.innerHTML = Vista.proximamente(titulo); break;
      case '/': case '':
        titulo = 'Oferta'; app.innerHTML = Vista.oferta(); break;
      default:
        titulo = 'No encontrada'; app.innerHTML = Vista.proximamente('Página no encontrada');
    }
    document.title = titulo + ' — ' + Config.NOMBRE_SITIO;
    Vista.menu();
    Vista.avisos();
    iniciarCarrusel();
    iniciarTemporizador();
    iniciarFormularios();
    window.scrollTo(0, 0);
  }
};

/* ======================================================================
   ARRANQUE
   ====================================================================== */
$('#nombreSitio').textContent = Config.NOMBRE_SITIO;
$('#copy').textContent = '© ' + new Date().getFullYear() + ' ' + Config.NOMBRE_SITIO;
$('#redes').innerHTML = Config.REDES.map(r =>
  `<a class="red" href="${h(r.url)}" target="_blank" rel="noopener noreferrer"><img src="${img(r.img)}" alt="" width="28" height="28">${h(r.nombre)}</a>`).join('');
iniciarTema();
iniciarMenu();
window.addEventListener('hashchange', () => Router.pintar());
Router.pintar();
})();
</script>
