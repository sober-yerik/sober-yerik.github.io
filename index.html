<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sober</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root,[data-tema="claro"]{
  color-scheme:light;
  --fondo:#FFFFFF;
  --superficie:#F5F5FA;
  --texto:#15151F;
  --suave:#6B6B7B;
  --linea:#E6E6EE;
  --acento:#3D4CFF;
  --acento-osc:#2733D6;
  --sobre-acento:#FFFFFF;
  --coral:#E8503F;
  --ok:#0F7B4B;
  --error:#C62828;
}
[data-tema="oscuro"]{
  color-scheme:dark;
  --fondo:#12121C;
  --superficie:#1C1C2B;
  --texto:#F2F2F8;
  --suave:#A3A3B8;
  --linea:#2E2E44;
  --acento:#7B87FF;
  --acento-osc:#98A1FF;
  --sobre-acento:#10101A;
  --coral:#FF8272;
  --ok:#4CD694;
  --error:#FF8A80;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--fondo);color:var(--texto);line-height:1.55;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;transition:background .25s ease,color .25s ease}
main{flex:1}
a{color:var(--acento)}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block;max-width:100%}
h1{line-height:1.15;letter-spacing:-.02em}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
.envuelve{max-width:1200px;margin:0 auto;padding:0 24px}
.cab{position:sticky;top:0;z-index:50;background:var(--fondo);border-bottom:1px solid var(--linea)}
.cab-fila{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.icono{background:none;border:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.8rem;line-height:1}
.icono:hover{background:var(--superficie)}
.marca{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--texto);font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.logo-caja{width:48px;height:48px;border-radius:12px;border:2px dashed var(--linea);background:var(--superficie);overflow:hidden;display:grid;place-items:center}
.logo-caja img{width:100%;height:100%;object-fit:contain}
.sol{display:none}
[data-tema="oscuro"] .sol{display:block}
[data-tema="oscuro"] .luna{display:none}
.velo{position:fixed;inset:0;background:rgba(10,10,20,.55);opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:80}
.velo.abierto{opacity:1;pointer-events:auto}
.menu{position:fixed;top:0;left:0;height:100%;width:min(320px,86%);background:var(--fondo);border-right:1px solid var(--linea);z-index:90;padding:16px;transform:translateX(-100%);transition:transform .3s ease;display:flex;flex-direction:column;gap:8px}
.menu.abierto{transform:none}
.menu-cab{display:flex;justify-content:space-between;align-items:center;font-size:1.2rem;padding:4px 4px 12px}
.saludo{padding:0 12px 8px;color:var(--suave)}
.menu nav{display:grid;gap:4px}
.menu nav a,.menu nav button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:14px 12px;font-weight:600;font-size:1.05rem;text-decoration:none;color:var(--texto)}
.menu nav a:hover,.menu nav button:hover{background:var(--superficie)}
.aviso{max-width:1200px;margin:16px auto 0;padding:12px 18px;border-radius:12px;font-weight:600;font-size:.95rem;background:var(--superficie);border:1px solid var(--linea);width:calc(100% - 48px)}
.aviso-ok{color:var(--ok);border-color:var(--ok)}
.aviso-error{color:var(--error);border-color:var(--error)}
.tarjeta .aviso{width:100%;margin:0}
.oferta{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;padding-top:32px;padding-bottom:64px;align-items:center}
.carrusel{position:relative;border-radius:24px;overflow:hidden;background:var(--superficie);aspect-ratio:4/3}
.pista{display:flex;height:100%;transition:transform .5s cubic-bezier(.22,.9,.35,1)}
.diapo{flex:0 0 100%;height:100%}
.diapo img{width:100%;height:100%;object-fit:cover}
.car-btn{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:var(--fondo);color:var(--texto);font-size:1.6rem;line-height:1;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.car-btn:hover{background:var(--superficie)}
.prev{left:14px}
.next{right:14px}
.puntos{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.puntos button{width:10px;height:10px;border-radius:50%;border:0;background:rgba(255,255,255,.6);box-shadow:0 0 0 1px rgba(0,0,0,.25);padding:0}
.puntos button[aria-current="true"]{background:var(--acento);width:26px;border-radius:999px}
.insignia{display:inline-block;background:var(--coral);color:#fff;font-weight:700;font-size:.85rem;padding:5px 14px;border-radius:999px;margin-bottom:14px}
[data-tema="oscuro"] .insignia{color:#12121C}
.panel h1{font-size:clamp(1.9rem,3.2vw,2.7rem);font-weight:800;margin-bottom:12px}
.precios{display:flex;align-items:baseline;gap:14px;margin-bottom:14px}
.precios b{font-size:1.9rem;font-weight:800}
.precios s{color:var(--suave);font-size:1.1rem}
.descripcion{color:var(--suave);margin-bottom:24px;max-width:46ch}
.tiempo{display:flex;gap:10px;margin-bottom:26px}
.u{background:var(--superficie);border:1px solid var(--linea);border-radius:14px;padding:10px 6px;min-width:70px;text-align:center;font-size:.78rem;color:var(--suave);display:grid}
.u b{font-size:1.6rem;font-weight:800;color:var(--texto);font-variant-numeric:tabular-nums}
.terminada{font-weight:800;font-size:1.2rem;color:var(--coral)}
.btn{display:inline-block;background:var(--acento);color:var(--sobre-acento);border:0;border-radius:999px;padding:15px 28px;font-weight:700;font-size:1rem;text-decoration:none;text-align:center;transition:background .2s ease,transform .15s ease}
.btn:hover{background:var(--acento-osc);transform:translateY(-1px)}
.auth{display:grid;place-items:center;padding:48px 24px}
.tarjeta{width:100%;max-width:440px;background:var(--superficie);border:1px solid var(--linea);border-radius:24px;padding:32px;display:grid;gap:16px}
.tarjeta h1{font-size:1.7rem}
.tarjeta label{display:grid;gap:6px;font-weight:600;font-size:.92rem}
.tarjeta input{font:inherit;font-weight:400;padding:13px 16px;border-radius:12px;border:1.5px solid var(--linea);background:var(--fondo);color:var(--texto)}
.tarjeta input:focus{border-color:var(--acento)}
.tarjeta .btn{width:100%}
.cambio{text-align:center;font-size:.92rem;color:var(--suave)}
.captcha{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.captcha img{border-radius:10px;border:1px solid var(--linea)}
.enlace{background:none;border:0;color:var(--acento);text-decoration:underline;font-size:.9rem}
.pie{border-top:1px solid var(--linea);background:var(--superficie);padding:28px 0}
.pie-fila{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;color:var(--suave);font-size:.92rem}
.redes{display:flex;gap:12px;flex-wrap:wrap}
.red{display:flex;align-items:center;gap:10px;background:var(--fondo);border:1px solid var(--linea);border-radius:999px;padding:8px 18px 8px 10px;text-decoration:none;color:var(--texto);font-weight:600;transition:transform .15s ease,border-color .15s ease}
.red:hover{transform:translateY(-2px);border-color:var(--acento)}
.red img{border-radius:50%}
@media (max-width:900px){
  .oferta{grid-template-columns:1fr;gap:28px}
}
@media (max-width:480px){
  .marca-nombre{display:none}
  .tarjeta{padding:24px}
  .u{min-width:62px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
}
.logo-caja {
  width: auto;
  height: 36px;
  border: 0;
  background: none;
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.logo-caja img {
  width: auto;
  height: 100%;
  object-fit: contain;
  border-radius: 8px;
}
.menu-secundario {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 30px;
  padding: 14px 20px;
  background: var(--superficie);
  border-bottom: 1px solid var(--linea);
}
.menu-secundario a {
  color: var(--texto);
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  transition: color 0.2s ease;
}
.menu-secundario a:hover {
  color: var(--acento);
}
@media (max-width: 600px) {
  .menu-secundario {
    gap: 16px;
    padding: 12px 8px;
  }
  .menu-secundario a {
    font-size: 12px;
  }
}
.admin{padding-top:32px;padding-bottom:64px}
.admin-cab{margin-bottom:24px}
.admin-cab h1{font-size:clamp(1.7rem,3vw,2.3rem);font-weight:800;margin-bottom:6px}
.admin-cab .descripcion{margin-bottom:0}
.resumen{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:12px}
.dato{background:var(--superficie);border:1px solid var(--linea);border-radius:18px;padding:18px 20px;display:grid;gap:2px}
.dato b{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}
.dato span{color:var(--suave);font-size:.9rem}
.seccion{padding:32px 0;border-bottom:1px solid var(--linea);scroll-margin-top:84px}
.seccion:last-child{border-bottom:0}
.seccion h2{font-size:1.4rem;font-weight:800;margin-bottom:4px}
.seccion .descripcion{margin-bottom:18px;max-width:none}
.busqueda{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.busqueda input,.form-admin input,.form-admin select,.en-linea select{font:inherit;padding:11px 14px;border-radius:12px;border:1.5px solid var(--linea);background:var(--fondo);color:var(--texto)}
.busqueda input{flex:1 1 260px;min-width:0}
.busqueda input:focus,.form-admin input:focus,.form-admin select:focus,.en-linea select:focus{border-color:var(--acento)}
.tabla-caja{overflow-x:auto;border:1px solid var(--linea);border-radius:18px;background:var(--fondo)}
.tabla{width:100%;border-collapse:collapse;font-size:.93rem}
.tabla th,.tabla td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--linea);white-space:nowrap}
.tabla th{background:var(--superficie);font-weight:700;color:var(--suave);font-size:.85rem}
.tabla tbody tr:last-child td{border-bottom:0}
.tabla tbody tr:hover{background:var(--superficie)}
.tabla .vacio{text-align:center;color:var(--suave);padding:28px}
.etiqueta{display:inline-block;padding:3px 12px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--superficie);border:1px solid var(--linea)}
.etiqueta-administrador{color:var(--acento);border-color:var(--acento)}
.etiqueta-activo{color:var(--ok);border-color:var(--ok)}
.etiqueta-inactivo{color:var(--error);border-color:var(--error)}
.suave{color:var(--suave);font-size:.9rem}
.btn-chico{padding:8px 16px;font-size:.88rem}
.btn-contorno{background:none;color:var(--texto);border:1.5px solid var(--linea)}
.btn-contorno:hover{background:var(--superficie);border-color:var(--acento)}
.btn-peligro{background:var(--error);color:#fff}
.btn-peligro:hover{background:var(--error);filter:brightness(.9)}
[data-tema="oscuro"] .btn-peligro{color:#12121C}
.en-linea{display:flex;gap:8px;align-items:center}
.fila-acciones{display:flex;gap:8px;flex-wrap:wrap}
.form-admin{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:760px}
.form-admin label{display:grid;gap:6px;font-weight:600;font-size:.92rem}
.form-pie{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap}
@media (max-width:900px){
  .resumen{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:600px){
  .form-admin{grid-template-columns:1fr}
}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;width:auto;max-width:min(92vw,520px);margin:0;background:var(--fondo);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
</style>

<script>
(function () {
  const C = window.SOBER;
  const CLAVE_USUARIOS = 'sober_usuarios';
  const CLAVE_SIGUIENTE = 'sober_siguiente_id';
  const CLAVE_OFERTA = 'sober_oferta_fin';
  const CLAVE_SESION = 'sober_sesion';
  const CLAVE_AVISO = 'sober_aviso';
  const CLAVE_CAPTCHA = 'sober_captcha';

  function h(texto) {
    return String(texto == null ? '' : texto)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function rotr(x, n) {
    return (x >>> n) | (x << (32 - n));
  }

  function constantes() {
    const primos = [];
    for (let n = 2; primos.length < 64; n++) {
      let esPrimo = true;
      for (let d = 2; d * d <= n; d++) {
        if (n % d === 0) { esPrimo = false; break; }
      }
      if (esPrimo) primos.push(n);
    }
    const frac = x => Math.floor((x - Math.floor(x)) * 4294967296);
    return {
      K: primos.map(p => frac(Math.cbrt(p))),
      H: primos.slice(0, 8).map(p => frac(Math.sqrt(p)))
    };
  }

  const CONST = constantes();

  function sha256(texto) {
    const K = CONST.K;
    const bytes = Array.from(new TextEncoder().encode(texto));
    const bits = bytes.length * 8;
    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    const alto = Math.floor(bits / 4294967296);
    const bajo = bits >>> 0;
    bytes.push((alto >>> 24) & 255, (alto >>> 16) & 255, (alto >>> 8) & 255, alto & 255);
    bytes.push((bajo >>> 24) & 255, (bajo >>> 16) & 255, (bajo >>> 8) & 255, bajo & 255);

    let H = CONST.H.slice();
    for (let i = 0; i < bytes.length; i += 64) {
      const w = new Array(64);
      for (let j = 0; j < 16; j++) {
        w[j] = (bytes[i + 4 * j] << 24) | (bytes[i + 4 * j + 1] << 16) | (bytes[i + 4 * j + 2] << 8) | bytes[i + 4 * j + 3];
      }
      for (let j = 16; j < 64; j++) {
        const s0 = rotr(w[j - 15], 7) ^ rotr(w[j - 15], 18) ^ (w[j - 15] >>> 3);
        const s1 = rotr(w[j - 2], 17) ^ rotr(w[j - 2], 19) ^ (w[j - 2] >>> 10);
        w[j] = (w[j - 16] + s0 + w[j - 7] + s1) | 0;
      }
      let [a, b, c, d, e, f, g, hh] = H;
      for (let j = 0; j < 64; j++) {
        const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
        const ch = (e & f) ^ (~e & g);
        const t1 = (hh + S1 + ch + K[j] + w[j]) | 0;
        const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
        const mj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + mj) | 0;
        hh = g; g = f; f = e; e = (d + t1) | 0;
        d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      H = [H[0] + a, H[1] + b, H[2] + c, H[3] + d, H[4] + e, H[5] + f, H[6] + g, H[7] + hh].map(x => x | 0);
    }
    return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
  }

  function aleatorio(n) {
    const letras = '0123456789abcdef';
    const datos = new Uint8Array(n);
    if (window.crypto && crypto.getRandomValues) {
      crypto.getRandomValues(datos);
    } else {
      for (let i = 0; i < n; i++) datos[i] = Math.floor(Math.random() * 256);
    }
    return Array.from(datos, b => letras[b % 16]).join('');
  }

  function leer(almacen, clave, defecto) {
    try {
      const crudo = almacen.getItem(clave);
      return crudo === null ? defecto : JSON.parse(crudo);
    } catch (e) {
      return defecto;
    }
  }

  function guardar(almacen, clave, valor) {
    try {
      almacen.setItem(clave, JSON.stringify(valor));
    } catch (e) {}
  }

  function borrar(almacen, clave) {
    try {
      almacen.removeItem(clave);
    } catch (e) {}
  }

  function hoy() {
    const d = new Date();
    const mes = String(d.getMonth() + 1).padStart(2, '0');
    const dia = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + mes + '-' + dia;
  }

  function todos() {
    return leer(localStorage, CLAVE_USUARIOS, []);
  }

  function guardarTodos(lista) {
    guardar(localStorage, CLAVE_USUARIOS, lista);
  }

  function siguienteId() {
    const id = leer(localStorage, CLAVE_SIGUIENTE, 1);
    guardar(localStorage, CLAVE_SIGUIENTE, id + 1);
    return id;
  }

  function normalizarCorreo(correo) {
    return String(correo || '').trim().toLowerCase();
  }

  function porId(id) {
    return todos().find(u => u.id === Number(id)) || null;
  }

  function porCorreo(correo) {
    const c = normalizarCorreo(correo);
    return todos().find(u => u.correo === c) || null;
  }

  function correoOcupado(correo, exceptoId) {
    const c = normalizarCorreo(correo);
    if (c === C.admin.correo) return true;
    return todos().some(u => u.correo === c && u.id !== Number(exceptoId || 0));
  }

  function validar(d, exceptoId) {
    const nombre = String(d.nombre || '').trim();
    const correo = normalizarCorreo(d.correo);
    const telefono = String(d.telefono || '').trim();
    const fecha = String(d.fecha || '').trim();

    if (nombre.length < 2 || nombre.length > 40) return 'Escribe el nombre (de 2 a 40 caracteres).';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo) || correo.length > 254) return 'Escribe un correo válido.';
    if (correoOcupado(correo, exceptoId)) return 'Ese correo ya tiene una cuenta.';
    if (!/^[0-9]{10,15}$/.test(telefono)) return 'Escribe un teléfono de 10 a 15 dígitos.';
    if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha) || isNaN(Date.parse(fecha))) return 'Selecciona una fecha de nacimiento válida.';
    if (fecha > hoy()) return 'La fecha de nacimiento no puede ser futura.';
    return null;
  }

  function crearHash(clave) {
    const sal = aleatorio(16);
    return { sal: sal, hash: sha256(sal + clave) };
  }

  function crear(d, rol) {
    const error = validar(d, 0);
    if (error) return error;
    const clave = String(d.clave || '');
    if (clave.length < 8) return 'La contraseña debe tener al menos 8 caracteres.';

    const lista = todos();
    const credencial = crearHash(clave);
    lista.push({
      id: siguienteId(),
      nombre: String(d.nombre).trim(),
      correo: normalizarCorreo(d.correo),
      telefono: String(d.telefono).trim(),
      fecha: String(d.fecha).trim(),
      sal: credencial.sal,
      clave: credencial.hash,
      rol: rol === 'administrador' ? 'administrador' : 'comprador',
      status: 'activo'
    });
    guardarTodos(lista);
    return null;
  }

  function actualizar(id, d) {
    const lista = todos();
    const u = lista.find(x => x.id === Number(id));
    if (!u) return 'El usuario no existe.';
    const error = validar(d, id);
    if (error) return error;

    const clave = String(d.clave || '');
    if (clave !== '' && clave.length < 8) return 'La nueva contraseña debe tener al menos 8 caracteres.';

    u.nombre = String(d.nombre).trim();
    u.correo = normalizarCorreo(d.correo);
    u.telefono = String(d.telefono).trim();
    u.fecha = String(d.fecha).trim();
    if (clave !== '') {
      const credencial = crearHash(clave);
      u.sal = credencial.sal;
      u.clave = credencial.hash;
    }
    guardarTodos(lista);
    return null;
  }

  function asignarRol(id, rol) {
    const lista = todos();
    const u = lista.find(x => x.id === Number(id));
    if (!u) return false;
    u.rol = rol === 'administrador' ? 'administrador' : 'comprador';
    guardarTodos(lista);
    return true;
  }

  function cambiarEstado(id, estado) {
    const lista = todos();
    const u = lista.find(x => x.id === Number(id));
    if (!u) return false;
    u.status = estado === 'activo' ? 'activo' : 'inactivo';
    guardarTodos(lista);
    return true;
  }

  function eliminar(id) {
    const lista = todos();
    const nueva = lista.filter(x => x.id !== Number(id));
    if (nueva.length === lista.length) return false;
    guardarTodos(nueva);
    return true;
  }

  function buscar(texto) {
    const q = String(texto || '').trim().toLowerCase();
    const lista = todos().slice().sort((a, b) => b.id - a.id);
    if (q === '') return lista;
    return lista.filter(u =>
      u.nombre.toLowerCase().includes(q) ||
      u.correo.includes(q) ||
      u.telefono.includes(q)
    );
  }

  function resumen() {
    const lista = todos();
    return {
      total: lista.length,
      administradores: lista.filter(u => u.rol === 'administrador').length,
      compradores: lista.filter(u => u.rol !== 'administrador').length,
      inactivos: lista.filter(u => u.status !== 'activo').length
    };
  }

  function sesion() {
    return leer(sessionStorage, CLAVE_SESION, null);
  }

  function tipo() {
    const s = sesion();
    if (!s) return 'invitado';
    if (s.adminIntegrado) return 'administrador';
    const u = porId(s.id);
    if (!u || u.status !== 'activo') {
      borrar(sessionStorage, CLAVE_SESION);
      return 'invitado';
    }
    return u.rol === 'administrador' ? 'administrador' : 'comprador';
  }

  function inicio() {
    const t = tipo();
    if (t === 'administrador') return 'admin';
    if (t === 'comprador') return 'usuario';
    return 'inicio';
  }

  function iniciar(correo, clave) {
    const c = normalizarCorreo(correo);
    const k = String(clave || '');

    if (c === '' || k === '') return 'Escribe tu correo y tu contraseña.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c)) return 'Escribe un correo válido.';

    if (c === C.admin.correo) {
      if (sha256(C.admin.sal + k) !== C.admin.hash) return 'Correo o contraseña incorrectos.';
      guardar(sessionStorage, CLAVE_SESION, { id: 0, nombre: 'Administrador', adminIntegrado: true });
      return null;
    }

    const u = porCorreo(c);
    if (!u || sha256(u.sal + k) !== u.clave) return 'Correo o contraseña incorrectos.';
    if (u.status !== 'activo') return 'Tu cuenta está desactivada. Contacta al administrador.';

    guardar(sessionStorage, CLAVE_SESION, { id: u.id, nombre: u.nombre, adminIntegrado: false });
    return null;
  }

  function cerrar() {
    borrar(sessionStorage, CLAVE_SESION);
  }

  function avisar(tipoAviso, texto) {
    guardar(sessionStorage, CLAVE_AVISO, { tipo: tipoAviso, texto: texto });
  }

  function tomarAviso() {
    const a = leer(sessionStorage, CLAVE_AVISO, null);
    borrar(sessionStorage, CLAVE_AVISO);
    return a;
  }

  function generarCaptcha() {
    const letras = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const azar = n => Math.floor(Math.random() * (n + 1));
    let codigo = '';
    for (let i = 0; i < 5; i++) codigo += letras[Math.floor(Math.random() * letras.length)];
    guardar(sessionStorage, CLAVE_CAPTCHA, codigo);

    let svg = '<svg xmlns="http://www.w3.org/2000/svg" width="170" height="56" viewBox="0 0 170 56"><rect width="170" height="56" fill="#eef0ff"/>';
    for (let i = 0; i < 6; i++) {
      svg += '<line x1="' + azar(170) + '" y1="' + azar(56) + '" x2="' + azar(170) + '" y2="' + azar(56) + '" stroke="#8a90d6" stroke-width="1.5"/>';
    }
    for (let i = 0; i < 5; i++) {
      const x = 16 + i * 30;
      const y = 34 + azar(8);
      const giro = azar(44) - 22;
      svg += '<text x="' + x + '" y="' + y + '" font-family="Verdana,sans-serif" font-size="30" font-weight="700" fill="#1b1b3a" transform="rotate(' + giro + ' ' + x + ' 30)">' + codigo[i] + '</text>';
    }
    svg += '</svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  function validarCaptcha(texto) {
    const esperado = leer(sessionStorage, CLAVE_CAPTCHA, null);
    borrar(sessionStorage, CLAVE_CAPTCHA);
    return esperado !== null && String(texto || '').trim().toUpperCase() === esperado;
  }

  function ofertaFin() {
    let fin = leer(localStorage, CLAVE_OFERTA, 0);
    if (!fin || fin <= 0) {
      fin = Math.floor(Date.now() / 1000) + C.ofertaDias * 86400;
      guardar(localStorage, CLAVE_OFERTA, fin);
    }
    return fin;
  }

  function registrar(d) {
    if (!validarCaptcha(d.captcha)) return 'El código de seguridad no coincide.';
    const clave = String(d.clave || '');
    if (clave.length < 8) return 'La contraseña debe tener al menos 8 caracteres.';
    if (clave !== String(d.clave2 || '')) return 'Las contraseñas no coinciden.';
    return crear(d, 'comprador');
  }

  window.SoberDatos = {
    h: h,
    sha256: sha256,
    todos: todos,
    porId: porId,
    porCorreo: porCorreo,
    buscar: buscar,
    resumen: resumen,
    crear: crear,
    registrar: registrar,
    actualizar: actualizar,
    asignarRol: asignarRol,
    cambiarEstado: cambiarEstado,
    eliminar: eliminar,
    sesion: sesion,
    tipo: tipo,
    inicio: inicio,
    iniciar: iniciar,
    cerrar: cerrar,
    avisar: avisar,
    tomarAviso: tomarAviso,
    generarCaptcha: generarCaptcha,
    ofertaFin: ofertaFin
  };
})();

  function toast(tipoAviso, texto) {

    $('#menuCerrar').addEventListener('click', cerrar);
    velo.addEventListener('click', cerrar);

    const cerrarSesion = $('#cerrarSesion');
    if (cerrarSesion) {
      cerrarSesion.addEventListener('click', function () {

        ir('inicio');
      });

  function iniciarCarrusel() {
    const c = $('.carrusel');
    if (!c) return;
    const pista = $('.pista', c);
    const puntos = $('.puntos', c);
    const n = pista.children.length;
    let i = 0;
    let reloj = null;

    const ir2 = k => {
      i = (k + n) % n;
      pista.style.transform = 'translateX(-' + (i * 100) + '%)';
      $$('button', puntos).forEach((p, j) => p.setAttribute('aria-current', String(j === i)));
    };
    const parar = () => { if (reloj) { clearInterval(reloj); reloj = null; } };
    const arrancar = () => {
      parar();
      if (n > 1 && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        reloj = setInterval(() => ir2(i + 1), 5000);
        relojes.push(reloj);
      }
    };

    for (let j = 0; j < n; j++) {
      const p = document.createElement('button');
      p.type = 'button';
      p.setAttribute('aria-label', 'Ir a la foto ' + (j + 1));
      p.addEventListener('click', () => { ir2(j); arrancar(); });
      puntos.appendChild(p);
    }
    if (n < 2) $$('.car-btn', c).forEach(b => { b.hidden = true; });

    $('.prev', c).addEventListener('click', () => { ir2(i - 1); arrancar(); });
    $('.next', c).addEventListener('click', () => { ir2(i + 1); arrancar(); });
    c.addEventListener('mouseenter', parar);
    c.addEventListener('mouseleave', arrancar);
    c.addEventListener('focusin', parar);
    c.addEventListener('focusout', arrancar);
    c.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') ir2(i - 1);
      if (e.key === 'ArrowRight') ir2(i + 1);
    });

    let inicioX = null;
    c.addEventListener('touchstart', e => { inicioX = e.touches[0].clientX; }, { passive: true });
    c.addEventListener('touchend', e => {
      if (inicioX === null) return;
      const d = e.changedTouches[0].clientX - inicioX;
      if (Math.abs(d) > 40) { ir2(d < 0 ? i + 1 : i - 1); arrancar(); }
      inicioX = null;
    });

    ir2(0);
    arrancar();
  }

  function iniciarTemporizador() {
    const el = $('#temporizador');
    if (!el) return;
    const fin = +el.dataset.fin * 1000;
    const cero = n => String(n).padStart(2, '0');
    const unidad = k => $('[data-u="' + k + '"]', el);
    let reloj = null;

    const dibujar = () => {
      const s = Math.max(0, Math.floor((fin - Date.now()) / 1000));
      if (s === 0) {
        if (reloj) clearInterval(reloj);
        el.innerHTML = '<p class="terminada">Oferta finalizada</p>';
        return;
      }
      unidad('d').textContent = cero(Math.floor(s / 86400));
      unidad('h').textContent = cero(Math.floor(s % 86400 / 3600));
      unidad('m').textContent = cero(Math.floor(s % 3600 / 60));
      unidad('s').textContent = cero(s % 60);
    };

    reloj = setInterval(dibujar, 1000);
    relojes.push(reloj);
    dibujar();
  }

      ir(inicioVista());
    });

      imagen.src = D.generarCaptcha();
      campo.value = '';
    };
    recargar();
    $('#recargarCaptcha').addEventListener('click', recargar);

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const f = new FormData(form);
      const error = D.registrar({
        nombre: f.get('nombre'),
        correo: f.get('correo'),
        telefono: f.get('telefono'),
        fecha: f.get('fecha_nacimiento'),
        clave: f.get('clave'),
        clave2: f.get('clave2'),
        captcha: f.get('captcha')
      });
      if (error) {
        mostrarError(form, error);
        recargar();
        return;
      }
      D.avisar('ok', 'Cuenta creada. Tus datos se guardaron correctamente.');
      ir('login');
    });
  }

    const r = D.resumen();
    $('#resumen').innerHTML =
      '<div class="dato"><b>' + r.total + '</b><span>Usuarios registrados</span></div>' +
      '<div class="dato"><b>' + r.administradores + '</b><span>Administradores</span></div>' +
      '<div class="dato"><b>' + r.compradores + '</b><span>Compradores</span></div>' +
      '<div class="dato"><b>' + r.inactivos + '</b><span>Cuentas desactivadas</span></div>';
  }

  function pintarConsulta() {
    const lista = D.buscar(textoBusqueda);
    $('#tablaConsulta').innerHTML = lista.length ? lista.map(function (u) {
      return '<tr><td>' + u.id + '</td><td>' + h(u.nombre) + '</td><td>' + h(u.correo) + '</td><td>' + h(u.telefono) + '</td><td>' + h(u.fecha) + '</td>' +
        '<td>' + etiquetaRol(u.rol) + '</td><td>' + etiquetaEstado(u.status) + '</td>' +
        '<td><button class="btn btn-chico btn-contorno" type="button" data-editar="' + u.id + '">Editar</button></td></tr>';
    }).join('') : filaVacia(8);
  }

  function pintarPermisos() {
    const lista = D.buscar('');
    $('#tablaPermisos').innerHTML = lista.length ? lista.map(function (u) {
      const control = u.id === miId()
        ? '<span class="suave">Tu cuenta</span>'
        : '<form class="en-linea" data-accion="rol" data-id="' + u.id + '">' +
            '<select name="rol" aria-label="Rol de ' + h(u.nombre) + '">' +
              '<option value="comprador"' + (u.rol === 'comprador' ? ' selected' : '') + '>Comprador</option>' +
              '<option value="administrador"' + (u.rol === 'administrador' ? ' selected' : '') + '>Administrador</option>' +
            '</select><button class="btn btn-chico" type="submit">Guardar</button></form>';
      return '<tr><td>' + h(u.nombre) + '</td><td>' + h(u.correo) + '</td><td>' + etiquetaRol(u.rol) + '</td><td>' + control + '</td></tr>';
    }).join('') : filaVacia(4);
  }

  function pintarActualizacion() {
    const contenedor = $('#contActualizacion');
    const u = editarId === null ? null : D.porId(editarId);

    if (u) {
      contenedor.innerHTML =
        '<p class="descripcion">Modificando a ' + h(u.nombre) + ' (ID ' + u.id + '). Deja la contraseña vacía para conservar la actual.</p>' +
        '<form class="form-admin" data-accion="actualizar" data-id="' + u.id + '" novalidate>' +
          '<label>Nombre<input type="text" name="nombre" maxlength="40" value="' + h(u.nombre) + '" required></label>' +
          '<label>Correo electrónico<input type="email" name="correo" value="' + h(u.correo) + '" required></label>' +
          '<label>Teléfono<input type="tel" name="telefono" inputmode="numeric" pattern="[0-9]{10,15}" maxlength="15" value="' + h(u.telefono) + '" required></label>' +
          '<label>Fecha de nacimiento<input type="date" name="fecha_nacimiento" value="' + h(u.fecha) + '" required></label>' +
          '<label>Nueva contraseña (opcional)<input type="password" name="clave" minlength="8" autocomplete="new-password"></label>' +
          '<div class="form-pie"><button class="btn" type="submit">Guardar cambios</button><button class="btn btn-contorno" type="button" data-cancelar="1">Cancelar</button></div>' +
        '</form>';
      return;
    }

    editarId = null;
    const lista = D.buscar('');
    contenedor.innerHTML =
      '<p class="descripcion">Elige un usuario para modificar sus datos.</p>' +
      '<div class="tabla-caja"><table class="tabla"><thead><tr><th>ID</th><th>Nombre</th><th>Correo</th><th></th></tr></thead><tbody>' +
      (lista.length ? lista.map(function (x) {
        return '<tr><td>' + x.id + '</td><td>' + h(x.nombre) + '</td><td>' + h(x.correo) + '</td>' +
          '<td><button class="btn btn-chico" type="button" data-editar="' + x.id + '">Editar</button></td></tr>';
      }).join('') : filaVacia(4)) + '</tbody></table></div>';
  }

  function pintarBaja() {
    const lista = D.buscar('');
    $('#tablaBaja').innerHTML = lista.length ? lista.map(function (u) {
      const activo = u.status === 'activo';
      const acciones = u.id === miId()
        ? '<span class="suave">Tu cuenta</span>'
        : '<div class="fila-acciones">' +
            '<form class="en-linea" data-accion="estado" data-id="' + u.id + '" data-estado="' + (activo ? 'inactivo' : 'activo') + '">' +
              '<button class="btn btn-chico btn-contorno" type="submit">' + (activo ? 'Desactivar' : 'Reactivar') + '</button></form>' +
            '<form class="en-linea" data-accion="baja" data-id="' + u.id + '"><button class="btn btn-chico btn-peligro" type="submit">Eliminar</button></form>' +
          '</div>';
      return '<tr><td>' + h(u.nombre) + '</td><td>' + h(u.correo) + '</td><td>' + etiquetaEstado(u.status) + '</td><td>' + acciones + '</td></tr>';
    }).join('') : filaVacia(4);
  }

  function pintarTodoAdmin() {
    pintarResumen();
    pintarConsulta();
    pintarPermisos();
    pintarActualizacion();
    pintarBaja();
  }

  function irSeccion(id) {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function iniciarAdmin() {
    textoBusqueda = '';
    editarId = null;
    const buscador = $('#buscador');
    buscador.addEventListener('input', function () {
      textoBusqueda = buscador.value;
      pintarConsulta();
    });
    pintarTodoAdmin();
  }

  function accionAdmin(f) {
    const accion = f.dataset.accion;
    const id = Number(f.dataset.id || 0);
    const d = Object.fromEntries(new FormData(f).entries());
    const datos = { nombre: d.nombre, correo: d.correo, telefono: d.telefono, fecha: d.fecha_nacimiento, clave: d.clave };

    if (D.tipo() !== 'administrador') {
      ir('login');
      return;
    }

    if (accion === 'alta') {
      const error = D.crear(datos, d.rol);
      if (error) { toast('error', error); return; }
      f.reset();
      pintarTodoAdmin();
      toast('ok', 'Usuario creado correctamente.');
      irSeccion('consulta');
      return;
    }

    if (accion === 'actualizar') {
      const error = D.actualizar(id, datos);
      if (error) { toast('error', error); return; }
      editarId = null;
      pintarTodoAdmin();
      toast('ok', 'Datos actualizados correctamente.');
      irSeccion('consulta');
      return;
    }

    if (id === miId()) {
      toast('error', 'No puedes modificar tu propia cuenta desde aquí.');
      return;
    }

    if (accion === 'rol') {
      if (!D.asignarRol(id, d.rol)) { toast('error', 'El usuario no existe.'); return; }
      pintarTodoAdmin();
      toast('ok', 'Permisos actualizados.');
      return;
    }

    if (accion === 'estado') {
      const estado = f.dataset.estado;
      if (!D.cambiarEstado(id, estado)) { toast('error', 'El usuario no existe.'); return; }
      pintarTodoAdmin();
      toast('ok', estado === 'activo' ? 'Cuenta reactivada.' : 'Cuenta desactivada.');
      return;
    }

    if (accion === 'baja') {
      const u = D.porId(id);
      if (!u) { toast('error', 'El usuario no existe.'); return; }
      if (!confirm('¿Eliminar a ' + u.nombre + '? Esta acción no se puede deshacer.')) return;
      D.eliminar(id);
      pintarTodoAdmin();
      toast('ok', 'Usuario eliminado.');
    }
  }

  function render(seccion) {
    pararRelojes();

    const cuerpo = {
      inicio: htmlOferta,
      login: htmlLogin,
      registro: htmlRegistro,
      usuario: htmlUsuario,
      admin: htmlAdmin
    }[vistaActual]();

    $('#cabecera').innerHTML = htmlCabecera();
    $('#vista').innerHTML = cuerpo;
    $('#pie').innerHTML = htmlPie();
    document.title = TITULOS[vistaActual] + ' — ' + C.nombreSitio;

    const pendiente = D.tomarAviso();
    if (pendiente) aviso(pendiente.tipo, pendiente.texto);

    iniciarTema();
    iniciarMenu();
    iniciarCarrusel();
    iniciarTemporizador();
    if (vistaActual === 'login') iniciarLogin();
    if (vistaActual === 'registro') iniciarRegistro();
    if (vistaActual === 'admin') iniciarAdmin();

    if (seccion) {
      requestAnimationFrame(function () { irSeccion(seccion); });
    } else {
      window.scrollTo(0, 0);
    }
  }

  document.addEventListener('click', function (e) {
    const enlace = e.target.closest('[data-ir]');
    if (enlace) {
      e.preventDefault();
      ir(enlace.dataset.ir);
      return;
    }
    const editar = e.target.closest('[data-editar]');
    if (editar && vistaActual === 'admin') {
      editarId = Number(editar.dataset.editar);
      pintarActualizacion();
      irSeccion('actualizacion');
      return;
    }
    if (e.target.closest('[data-cancelar]') && vistaActual === 'admin') {
      editarId = null;
      pintarActualizacion();
    }
  });

  document.addEventListener('submit', function (e) {
    const f = e.target.closest('form[data-accion]');
    if (!f || vistaActual !== 'admin') return;
    e.preventDefault();
    accionAdmin(f);
  });

  document.addEventListener('keydown', function (e) {
    const panel = $('#menu');
    if (e.key === 'Escape' && panel && panel.classList.contains('abierto')) {
      panel.classList.remove('abierto');
      $('#velo').classList.remove('abierto');
      panel.inert = true;
      $('#menuBtn').setAttribute('aria-expanded', 'false');
    }
  });

  ir(inicioVista());
})();
</script>
</body>
</html>
